name: Taiga story sync

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a bit later)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sync.py
        env:
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
